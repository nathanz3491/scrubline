# Release configuration. Together with internal/meta, this file holds every
# project-identifying string: retargeting the project means editing these two.
version: 2

project_name: scrubline

before:
  hooks:
    - go mod tidy

builds:
  - id: scrubline
    main: .
    binary: scrubline
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nathanz3491/scrubline/internal/meta.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: scrubline
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew tap publishing is disabled until the tap exists.
#
# This is commented out rather than switched off, on purpose: the block
# referenced {{ .Env.HOMEBREW_TAP_TOKEN }}, and a template referencing an
# environment variable that does not exist fails the release job outright --
# it would take the binaries down with it, for an optional extra. There is no
# way to half-enable that safely, so it is gone until there is a token.
#
# To turn it on: create github.com/nathanz3491/homebrew-tap, add a token with
# write access to it as the HOMEBREW_TAP_TOKEN secret, and uncomment.
#
# homebrew_casks:
#   - name: scrubline
#     repository:
#       owner: nathanz3491
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     directory: Casks
#     homepage: https://github.com/nathanz3491/scrubline
#     description: An undo timeline for the working tree your agent is editing
#     license: MIT

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/nathanz3491/scrubline/main/install.sh | sh
    ```
