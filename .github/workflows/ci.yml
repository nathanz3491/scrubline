name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so the two can never drift apart.
          # Pinning it here is what broke the first release: go.mod required
          # 1.27.1, this said 1.25, and setup-go sets GOTOOLCHAIN=local when a
          # version is pinned, so Go refused to upgrade itself and stopped dead
          # before compiling anything.
          go-version-file: go.mod
      - name: Configure git for the test suite
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so the two can never drift apart.
          # Pinning it here is what broke the first release: go.mod required
          # 1.27.1, this said 1.25, and setup-go sets GOTOOLCHAIN=local when a
          # version is pinned, so Go refused to upgrade itself and stopped dead
          # before compiling anything.
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o scrubline-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: scrubline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: scrubline-*

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so the two can never drift apart.
          # Pinning it here is what broke the first release: go.mod required
          # 1.27.1, this said 1.25, and setup-go sets GOTOOLCHAIN=local when a
          # version is pinned, so Go refused to upgrade itself and stopped dead
          # before compiling anything.
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
