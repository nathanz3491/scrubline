name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so the two can never drift apart.
          # Pinning it here is what broke the first release: go.mod required
          # 1.27.1, this said 1.25, and setup-go sets GOTOOLCHAIN=local when a
          # version is pinned, so Go refused to upgrade itself and stopped dead
          # before compiling anything.
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
